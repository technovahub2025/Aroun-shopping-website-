<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | Aroun Store</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f4f6; color: #111827; font: 16px/1.5 system-ui, sans-serif; }
    main { width: 100%; max-width: 440px; padding: 32px; border-radius: 20px; background: white; box-shadow: 0 8px 32px #11182712; }
    .brand { color: #15803d; font-weight: 700; }
    h1 { font-size: 26px; margin-bottom: 8px; }
    p { color: #4b5563; }
    label { display: block; margin-top: 20px; font-weight: 600; }
    input, button { width: 100%; padding: 12px; border-radius: 8px; font: inherit; }
    input { margin-top: 6px; border: 1px solid #9ca3af; }
    button { margin-top: 24px; border: 0; background: #15803d; color: white; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    :focus-visible { outline: 3px solid #86efac; outline-offset: 3px; }
    #error { color: #b91c1c; }
    #success { color: #15803d; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Aroun Store</div>
    <h1>Choose a new password</h1>
    <p id="hint">Your reset link expires after 15 minutes.</p>
    <form id="reset-form">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="6" required>
      <button id="submit" type="submit">Reset password</button>
    </form>
    <p id="error" role="alert" hidden></p>
    <p id="success" role="status" hidden></p>
    <noscript>Please enable JavaScript to reset your password.</noscript>
  </main>
  <script>
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const form = document.getElementById('reset-form');
    const button = document.getElementById('submit');
    const error = document.getElementById('error');
    const success = document.getElementById('success');

    function showError(message) {
      error.textContent = message;
      error.hidden = false;
    }

    if (!/^[a-f0-9]{64}$/i.test(token)) {
      form.hidden = true;
      document.getElementById('hint').hidden = true;
      showError('This reset link is invalid. Request a new password-reset email from the store.');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.hidden = true;
      const password = document.getElementById('password').value;
      if (password.length < 6) return showError('Password must be at least 6 characters.');
      if (password !== document.getElementById('confirm-password').value) {
        return showError('Passwords do not match.');
      }
      button.disabled = true;
      button.textContent = 'Saving…';
      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: password }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Could not reset your password. Request a new link and try again.');
        form.reset();
        form.hidden = true;
        document.getElementById('hint').hidden = true;
        success.textContent = 'Password updated. You can now return to the store and log in.';
        success.hidden = false;
      } catch (failure) {
        showError(failure.message || 'Could not reset your password. Please try again.');
      } finally {
        button.disabled = false;
        button.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
